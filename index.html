<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lectivio-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lectivio</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f7fb;
      }

      #initial-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7fb;
      }

      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .initial-loader-logo {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }

      .initial-loader-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: initial-loader-spin 0.7s linear infinite;
      }

      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>

    <div id="root">
      <div id="initial-loader">
        <div class="initial-loader-content">
          <img
            src="/lectivio-logo.png"
            alt="Lectivio"
            class="initial-loader-logo"
          />

          <div class="initial-loader-spinner"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
